<svg width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="256" height="256" fill="#3b82f6" rx="20"/>
  
  <!-- 机器人头部（白色圆角矩形） -->
  <rect x="50" y="50" width="156" height="156" rx="30" fill="#ffffff" stroke="#1e40af" stroke-width="4"/>
  
  <!-- 左眼 -->
  <circle cx="100" cy="110" r="10" fill="#3b82f6"/>
  
  <!-- 右眼 -->
  <circle cx="156" cy="110" r="10" fill="#3b82f6"/>
  
  <!-- 嘴巴（微笑弧线） -->
  <path d="M 100 145 Q 128 165 156 145" stroke="#3b82f6" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- 天线 -->
  <rect x="120" y="30" width="16" height="20" fill="#1e40af"/>
  <ellipse cx="128" cy="30" rx="10" ry="5" fill="#1e40af"/>
</svg>
